name: QUL check
# Twice a day, 06:07 and 18:07 Gulf time (02:07 and 14:07 UTC) — off the
# top of the hour, where GitHub drops the most scheduled runs. GitHub fires
# only some scheduled runs in this repo; the fingerprint sync's watchdog
# emails the owner if no check has completed for 7 days.
# "Run workflow" on the Actions tab runs it now.
on:
  schedule:
    - cron: '7 2,14 * * *'
  workflow_dispatch:
    inputs:
      test_notice:
        description: 'Only send a test notice (checks that the emails arrive)'
        type: boolean
        default: false
      self_test:
        description: 'Only run the self-test (checks the access token can open pull requests)'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: qul-sync
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check QUL for changes
        working-directory: sync
        run: python check.py ${{ inputs.test_notice && '--test-notice' || '' }} ${{ inputs.self_test && '--self-test' || '' }}
        env:
          QUL_TOKEN: ${{ secrets.QUL_TOKEN }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save what was seen
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync/state.json
          git diff --cached --quiet || (git commit -m 'QUL check: update state' && git pull --rebase --quiet && git push)
